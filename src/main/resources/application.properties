spring.application.name=webmdnch

# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/web_mdnch_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Base URL que usarás para construir las rutas accesibles desde el navegador
imagenes.urlBase=http://localhost:8080/imagenes/
documentos.urlBase=http://localhost:8080/documentos/


# Límite de tamaño para subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB