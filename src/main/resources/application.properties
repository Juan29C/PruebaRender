spring.application.name=webmdnch

# Configuración de la base de datos
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=web_mdnch_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=7Thebest
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Configuración de rutas de imágenes globales
imagenes.urlBase=http://localhost:8080/imagenes/

# Configuración de rutas de imágenes para la noticia
imagenes.directorio=C:/MuniImagenes/Noticias/