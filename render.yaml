services:
  - type: web
    name: webmdnch-backend
    env: docker
    repo: https://github.com/DaniSScript/Back-End-Web-MDNCH
    branch: docker
    dockerfilePath: ./Dockerfile
    
    # Configuración de health check
    healthCheckPath: /actuator/health
    
    # Plan (ajustar según necesidades)
    plan: free # o 'starter' para plan pagado
    
    # Variables de entorno
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      
      # Configuración de base de datos (completar con los datos del hosting)
      - key: DATABASE_URL
        value: jdbc:mysql://HOST:PORT/DATABASE_NAME?useSSL=true&serverTimezone=America/Lima&requireSSL=false
      
      - key: DATABASE_USERNAME
        value: YOUR_DB_USERNAME
      
      - key: DATABASE_PASSWORD
        sync: false # Marcar como sensible para que no se muestre en logs
      
      # JWT Secret (generar uno nuevo para producción)
      - key: JWT_SECRET
        generateValue: true # Render generará un valor aleatorio
      
      - key: JWT_EXPIRATION_MS
        value: 86400000
      
      # Base URL (actualizar con tu dominio de Render)
      - key: BASE_URL
        value: https://webmdnch-backend.onrender.com
      
      # Puerto (Render lo asigna automáticamente)
      - key: PORT
        value: 8080
      
      # Opciones de JVM
      - key: JAVA_OPTS
        value: "-Xmx512m -Xms256m"
    
    # Disco persistente para archivos (opcional, requiere plan pagado)
    # disk:
    #   name: webmdnch-files
    #   mountPath: /app
    #   sizeGB: 1
